name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test src/FluentNet.Tests/FluentNet.Tests.csproj -c Release

      - name: Publish WinUI 3 (x64 & arm64)
        run: |
          dotnet publish src/FluentNet.App/FluentNet.App.csproj -c Release -p:Platform=x64 -o dist/FluentNet-win-x64
          dotnet publish src/FluentNet.App/FluentNet.App.csproj -c Release -p:Platform=ARM64 -o dist/FluentNet-win-arm64

      - name: Build Classic Portable (.NET 4.8 WPF, x64)
        run: |
          dotnet build src/FluentNet.Classic/FluentNet.Classic.csproj -c Release -p:Platform=x64 -o dist/FluentNet-Classic-win-x64

      - name: Package Zip & SHA-256 Checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FluentNet-win-x64/* -DestinationPath dist/FluentNet-${{ github.ref_name }}-win-x64.zip
          Compress-Archive -Path dist/FluentNet-win-arm64/* -DestinationPath dist/FluentNet-${{ github.ref_name }}-win-arm64.zip
          Compress-Archive -Path dist/FluentNet-Classic-win-x64/* -DestinationPath dist/FluentNet-Classic-${{ github.ref_name }}-win-x64.zip
          Get-FileHash dist/*.zip -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
